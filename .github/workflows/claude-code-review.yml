name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Une revue consomme le quota de l'abonnement Claude (jeton OAuth, pas de
    # clé API ; ~2 $ au tarif de l'API) et quelques minutes : on ne la
    # déclenche pas pour une PR qui ne touche que de la prose.
    # `paths-ignore` plutôt qu'une liste blanche `paths`, pour ne jamais laisser passer du code non revu au
    # prétexte qu'il vit dans un dossier créé après l'écriture de ce filtre.
    # Une PR mixte (README + code) reste revue : GitHub ne saute le run que
    # si *tous* les fichiers modifiés correspondent.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Écriture : la revue publie ses constats sur la PR (cf. `--comment`).
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Prompt direct, sans le plugin `code-review` (2026-09-17). Le plugin
          # lance ses relecteurs en sous-agents d'arrière-plan ; en exécution
          # non interactive, la session s'arrête dès que l'agent principal
          # rend la main (« Still waiting on the PR-summary agent… »), et rien
          # n'était jamais publié — diagnostic complet dans #120. Ici, un seul
          # agent, aucun sous-agent à attendre.
          prompt: |
            DÉPÔT : ${{ github.repository }}
            PR : ${{ github.event.pull_request.number }}

            Relis cette pull request et publie ta revue sur GitHub.

            1. Lis la PR avec `gh pr view ${{ github.event.pull_request.number }} --comments`
               et `gh pr diff ${{ github.event.pull_request.number }}`. Lance chaque commande
               seule : pas de redirection (`>`), de tube (`|`) ni d'enchaînement (`;`, `&&`),
               ils sont refusés. Lis le CLAUDE.md racine et, si utile, les fichiers modifiés
               (Read, Grep, Glob).
            2. Ne signale que des défauts **certains** et importants :
               - le code ne compile pas ou ne se charge pas (erreur de type, import manquant,
                 référence non résolue) ;
               - une logique fausse quelles que soient les entrées ;
               - une perte de données ou un résultat faux silencieux ;
               - une faille de sécurité introduite par la PR ;
               - une violation nette d'une règle du CLAUDE.md, que tu cites mot pour mot.
               Ne signale pas le style, les préférences, les améliorations possibles, ni ce
               qui dépend d'entrées hypothétiques. Dans le doute, ne signale pas.
            3. Si un problème que tu relèves figure déjà dans un commentaire existant de la
               PR, ne le republie pas.
            4. Publie, en français :
               - un commentaire en ligne par défaut, avec
                 `mcp__github_inline_comment__create_inline_comment` (confirmed: true),
                 expliquant le défaut et sa conséquence concrète ;
               - puis un commentaire de synthèse avec `gh pr comment` : la liste des défauts
                 relevés, ou exactement « Aucun défaut relevé (compilation, logique, sécurité,
                 règles du CLAUDE.md). » s'il n'y en a pas.
          # Sans cette liste, en mode agent, l'action n'installe pas le serveur
          # `github_inline_comment` (src/mcp/install-mcp-server.ts) et les
          # commandes `gh` sont refusées en non interactif.
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

