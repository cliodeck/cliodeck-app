name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Une revue consomme le quota de l'abonnement Claude (jeton OAuth, pas de
    # clé API ; ~2 $ au tarif de l'API) et quelques minutes : on ne la
    # déclenche pas pour une PR qui ne touche que de la prose.
    # `paths-ignore` plutôt qu'une liste blanche `paths`, pour ne jamais laisser passer du code non revu au
    # prétexte qu'il vit dans un dossier créé après l'écriture de ce filtre.
    # Une PR mixte (README + code) reste revue : GitHub ne saute le run que
    # si *tous* les fichiers modifiés correspondent.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Écriture : la revue publie ses constats sur la PR (cf. `--comment`).
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # `--comment` est indispensable : sans lui, la commande du plugin rédige
          # sa revue puis s'arrête (« Do not post any GitHub comments »). Les
          # 50 revues « réussies » d'avril à juillet 2026 n'ont ainsi publié
          # aucun commentaire sur aucune PR ; leur verdict restait masqué
          # dans les logs.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # Outils de la commande du plugin (son en-tête `allowed-tools`), plus
          # les sous-agents qu'elle lance. Sans cette liste, en mode agent,
          # l'action n'installe pas le serveur `github_inline_comment`
          # (src/mcp/install-mcp-server.ts : il n'est ajouté que si
          # --allowedTools le nomme) et les commandes `gh` sont refusées en
          # non interactif : la revue du 2026-09-17 sur #116 s'arrêtait après
          # 3 tours avec une permission refusée, sans rien publier.
          # TEMPORAIRE (diagnostic, 2026-09-17) : la revue s'arrête encore après
          # 3 à 5 tours sur une permission refusée, et les logs ne disent pas
          # laquelle. `show_full_output` l'affiche. Dépôt public : ces logs
          # deviennent lisibles par tous — à retirer dès le diagnostic fait.
          show_full_output: true
          # `Agent` : nom actuel de l'outil qui lance les sous-agents (ex-`Task`,
          # gardé pour les versions antérieures de Claude Code).
          claude_args: >-
            --allowedTools "Agent,Task,Read,Glob,Grep,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

